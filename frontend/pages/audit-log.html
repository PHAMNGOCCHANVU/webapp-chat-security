<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Audit Logs - ZALEGRAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- Application Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-slate-800">Audit Logs</h1>
          <p class="text-slate-500">Monitor system activity and sensitive actions.</p>
        </div>
        <a href="chat-room.html" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 transition-colors">
          Back to Chat
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-sm font-semibold text-slate-600">
                <th class="p-4">Timestamp</th>
                <th class="p-4">Actor</th>
                <th class="p-4">Action</th>
                <th class="p-4">Target Type</th>
                <th class="p-4">IP Address</th>
                <th class="p-4">Description</th>
              </tr>
            </thead>
            <tbody id="audit-log-body" class="text-sm divide-y divide-slate-100">
              <!-- Logs will be injected here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../js/admin.js"></script>
  </body>
</html>
