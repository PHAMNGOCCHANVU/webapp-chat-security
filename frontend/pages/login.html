<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - ZALEGRAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 relative">
      <!-- Decorative gradient -->
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>
      
      <div class="p-8">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Chào mừng</h2>
          <p class="text-slate-500 mt-2 text-sm">Đăng nhập để vào ZALEGRAM</p>
        </div>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Username hoặc Email</label>
            <input type="text" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm" placeholder="Nhập email của bạn">
          </div>
          
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-medium text-slate-700">Mật khẩu</label>
              <a href="forgot-password.html" class="text-xs text-blue-600 hover:underline">Quên mật khẩu?</a>
            </div>
            <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm" placeholder="••••••••">
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="otp" class="rounded text-blue-600 focus:ring-blue-500">
            <label for="otp" class="text-xs text-slate-600">Gửi mã OTP xác thực qua email (Bảo mật 2 lớp)</label>
          </div>

          <button type="submit" class="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-900 transition-colors shadow-md mt-2">
            Đăng nhập
          </button>
        </form>
        
        <p class="text-center text-sm text-slate-500 mt-6">
          Chưa có tài khoản? <a href="register.html" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</a>
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
