<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - ZALEGRAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- Application Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
      <div class="p-8">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Tạo tài khoản</h2>
          <p class="text-slate-500 mt-2 text-sm">Tham gia ZALEGRAM ngay hôm nay</p>
        </div>

        <form id="register-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Tên hiển thị</label>
              <input type="text" id="displayName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Hồ Quốc Huy">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
              <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="huy123">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
            <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="you@example.com">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Ngày tháng năm sinh</label>
            <input type="date" id="dob" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-600">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Mật khẩu</label>
            <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
          </div>

          <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition-opacity shadow-md mt-2 text-sm">
            Đăng ký tài khoản
          </button>
        </form>
        
        <p class="text-center text-sm text-slate-500 mt-6">
          Đã có tài khoản? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/socketService.js"></script>
  </body>
</html>
