<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZALEGRAM - Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #3b82f6;
        --color-primary-dark: #2563eb;
      }
      body { font-family: 'Inter', sans-serif; }
      .scroll-hide::-webkit-scrollbar { display: none; }
      .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-50 h-screen flex overflow-hidden">
    
    <!-- Navigation Sidebar -->
    <nav class="w-20 bg-slate-900 flex flex-col items-center py-6 shrink-0 border-r border-slate-800 z-50">
      <!-- Logo -->
      <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg mb-8 text-white font-bold text-xl">
        Z
      </div>

      <!-- Nav Icons -->
      <div class="flex flex-col gap-6 flex-1 w-full items-center">
        <!-- Site 9: Danh sách cuộc trò chuyện -->
        <button onclick="switchTab('conversations')" class="nav-btn relative w-12 h-12 flex items-center justify-center rounded-xl bg-blue-600 text-white shadow-md transition-all group" title="Trò chuyện">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        </button>

        <!-- Site 8: Danh sách bạn bè -->
        <button onclick="switchTab('friends')" class="nav-btn relative w-12 h-12 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all group" title="Danh bạ">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>

        <!-- Site 6: Tìm kiếm -->
        <button onclick="switchTab('search')" class="nav-btn relative w-12 h-12 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all group" title="Tìm kiếm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>

        <!-- Site 12: Thông báo -->
        <button onclick="switchTab('notifications')" class="nav-btn relative w-12 h-12 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all group" title="Thông báo">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span class="absolute top-2 right-3 w-4 h-4 bg-red-500 text-[9px] text-white flex items-center justify-center border border-slate-900 rounded-full font-bold">1</span>
        </button>
      </div>

      <div class="mt-auto flex flex-col gap-4 items-center">
        <!-- Site 13: Cài đặt -->
        <button onclick="switchTab('settings')" class="nav-btn w-12 h-12 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all" title="Cài đặt">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
        <!-- Site 5: Hồ sơ -->
        <button onclick="switchTab('profile')" class="nav-btn w-10 h-10 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 flex items-center justify-center text-white font-bold text-sm ring-2 ring-slate-900 overflow-hidden cursor-pointer profile-avatar" title="Hồ sơ">
          U
        </button>
      </div>
    </nav>

    <!-- Side Panel Area -->
    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 z-10 shadow-sm relative">
      
      <!-- Conversations Panel (Site 9) -->
      <div id="panel-conversations" class="panel flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800">Đoạn chat</h2>
          <button id="create-group-btn" class="p-2 text-slate-500 bg-slate-50 hover:bg-slate-100 rounded-full transition-colors" title="Tạo nhóm mới">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
        <div class="p-3 border-b border-slate-100">
          <input type="text" class="block w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 sm:text-sm" placeholder="Tìm kiếm hội thoại...">
        </div>
        <div id="room-list" class="flex-1 overflow-y-auto scroll-hide p-2 space-y-1">
          <!-- Rooms injected here by app.js -->
        </div>
      </div>

      <!-- Friends Panel (Site 8) -->
      <div id="panel-friends" class="panel hidden flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800">Bạn bè</h2>
          <button class="p-2 text-slate-500 bg-slate-50 hover:bg-slate-100 rounded-full" title="Thêm bạn bè">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Friend Requests (Site 7 logic) -->
          <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Lời mời kết bạn (1)</h3>
            <div class="flex items-center justify-between bg-amber-50 p-3 rounded-xl border border-amber-100">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-300"></div>
                <p class="text-sm font-semibold text-slate-800">Trần C</p>
              </div>
              <div class="flex gap-1">
                <button class="p-1.5 bg-blue-600 text-white rounded-md text-xs font-bold">Nhận</button>
                <button class="p-1.5 bg-slate-200 text-slate-600 rounded-md text-xs font-bold">Xóa</button>
              </div>
            </div>
          </div>
          <!-- Friends List -->
          <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Đang hoạt động</h3>
            <div class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer" onclick="selectChat('vy')">
              <div class="relative">
                <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center font-bold">V</div>
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
              </div>
              <p class="text-sm font-medium text-slate-800">Nguyễn Uyên Vy</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Search Panel (Site 6) -->
      <div id="panel-search" class="panel hidden flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 mb-3">Tìm kiếm</h2>
          <input type="text" id="search-user-input" class="block w-full px-4 py-2 border border-blue-500 ring-2 ring-blue-100 rounded-xl bg-white sm:text-sm" placeholder="Nhập username (@xyz)...">
        </div>
        <div id="search-results" class="flex-1 overflow-y-auto">
          <!-- Search results injected here -->
        </div>
      </div>

      <!-- Notifications Panel (Site 12) -->
      <div id="panel-notifications" class="panel hidden flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800">Thông báo</h2>
          <button class="text-xs text-blue-600 font-medium">Đánh dấu đã đọc</button>
        </div>
        <div class="p-2 space-y-1">
          <div class="p-3 bg-blue-50 rounded-xl flex items-start gap-3">
            <div class="p-2 bg-blue-100 text-blue-600 rounded-full mt-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </div>
            <div>
              <p class="text-sm text-slate-800">Chào mừng bạn đến với ZALEGRAM!</p>
              <p class="text-xs text-slate-400 mt-1">1 giờ trước</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings Panel (Site 13) -->
      <div id="panel-settings" class="panel hidden flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-800">Cài đặt</h2>
        </div>
        <div class="p-4 space-y-4">
          <button class="w-full text-left p-3 hover:bg-slate-50 rounded-lg flex items-center justify-between text-sm text-slate-700">
            <span>Đổi mật khẩu</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
          <button class="w-full text-left p-3 hover:bg-slate-50 rounded-lg flex items-center justify-between text-sm text-slate-700">
            <span>Quyền riêng tư</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
          <button onclick="window.location.href='login.html'" class="w-full text-left p-3 hover:bg-red-50 text-red-600 rounded-lg flex items-center justify-between text-sm font-medium mt-4 border border-red-100">
            <span>Đăng xuất</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </button>
        </div>
      </div>

      <!-- Profile Panel (Site 5) -->
      <div id="panel-profile" class="panel hidden flex flex-col h-full">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-3">
          <h2 class="text-lg font-bold text-slate-800">Hồ sơ cá nhân</h2>
        </div>
        <div class="p-6 flex flex-col items-center border-b border-slate-100">
          <div class="profile-avatar w-24 h-24 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 text-white flex items-center justify-center text-3xl font-bold mb-4 shadow-md">
            U
          </div>
          <h3 id="profile-name" class="text-xl font-bold text-slate-800">Tên người dùng</h3>
          <p id="profile-username" class="text-slate-500 text-sm">@username</p>
          <button class="mt-4 px-4 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-200">
            Sửa hồ sơ
          </button>
        </div>
        <div class="p-4 space-y-3 text-sm text-slate-600">
          <div class="flex justify-between"><span>Email</span><span id="profile-email" class="font-medium text-slate-800">email@example.com</span></div>
          <div class="flex justify-between"><span>Ngày sinh</span><span class="font-medium text-slate-800">01/01/2000</span></div>
          <div class="flex justify-between mt-6 pt-4 border-t border-slate-100 hidden" id="admin-link-btn">
            <a href="admin.html" class="w-full text-center py-2 bg-purple-100 text-purple-700 font-bold rounded-lg hover:bg-purple-200 transition">
              Vào trang Admin
            </a>
          </div>
        </div>
      </div>

    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-[#f0f2f5] relative" id="main-chat-area">
      <!-- Dynamic Chat Header -->
      <header class="px-6 py-4 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm flex justify-between items-center shrink-0 z-10 sticky top-0">
        <div class="flex items-center gap-4" id="chat-header-info">
          <!-- Populated by JS -->
        </div>
        <div class="flex gap-2">
          <button class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </button>
        </div>
      </header>

      <!-- Dynamic Chat Messages -->
      <div class="flex-1 overflow-y-auto p-6 space-y-6" id="chat-messages">
        <!-- Messages injected by JS -->
      </div>

      <!-- Chat Input Area -->
      <div class="px-6 py-4 bg-white/80 backdrop-blur-md border-t border-slate-200 shrink-0">
        <form id="message-form" class="flex items-end gap-3 max-w-full">
          <div class="flex gap-1 pb-2">
            <button type="button" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors" title="Gửi tệp">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </button>
          </div>
          
          <div class="flex-1 bg-slate-100 hover:bg-slate-200 focus-within:bg-white border border-transparent focus-within:border-blue-500 rounded-2xl px-4 py-2.5 transition-all flex items-end">
            <input type="text" id="msg-input" class="w-full bg-transparent outline-none text-slate-800 text-sm leading-relaxed pt-0.5" placeholder="Nhập tin nhắn..." autocomplete="off">
          </div>

          <button type="submit" class="p-3.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-all shadow-md shrink-0 flex items-center justify-center">
            <svg class="w-5 h-5 translate-x-px -translate-y-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </form>
      </div>
    </main>

    <!-- App Logic Script -->
    <script src="../js/app.js"></script>
  </body>
</html>
